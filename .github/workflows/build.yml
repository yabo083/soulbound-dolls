name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew :platforms:neoforge-1.21.1:build

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: soulbound-dolls-neoforge-1.21.1
          path: platforms/neoforge-1.21.1/build/libs/*.jar
          if-no-files-found: error
